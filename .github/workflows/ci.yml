name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, audit/security-reliability-fixes]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run server/webhook-handler.test.ts server/plans.test.ts
      - run: pnpm run build
